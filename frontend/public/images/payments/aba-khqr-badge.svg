<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Outer Glow Effects -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Top Teal Gradient -->
    <linearGradient id="topTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006575" />
      <stop offset="50%" stop-color="#004D5A" />
      <stop offset="100%" stop-color="#002D36" />
    </linearGradient>

    <!-- Border Gradient with Red and Cyan Highlights -->
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1744" />
      <stop offset="35%" stop-color="#D50000" />
      <stop offset="65%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <!-- Clip Path for Rounded Corners -->
    <clipPath id="badgeClip">
      <rect x="8" y="8" width="184" height="184" rx="34" />
    </clipPath>
  </defs>

  <!-- Glowing Outer Border -->
  <rect x="6" y="6" width="188" height="188" rx="36" fill="none" stroke="url(#glowBorder)" stroke-width="4.5" filter="url(#neonGlow)" opacity="0.9"/>
  <rect x="6" y="6" width="188" height="188" rx="36" fill="none" stroke="url(#glowBorder)" stroke-width="3"/>

  <!-- Badge Content Container -->
  <g clip-path="url(#badgeClip)">
    <!-- Top Dark Teal Area -->
    <rect x="8" y="8" width="184" height="128" fill="url(#topTeal)"/>
    <rect x="8" y="8" width="184" height="128" fill="#000000" opacity="0.15"/>

    <!-- Subtle Inner Glow & Highlights -->
    <ellipse cx="100" cy="30" rx="70" ry="25" fill="#00E5FF" opacity="0.15"/>

    <!-- ABA Text -->
    <g fill="#FFFFFF" transform="translate(42, 60)">
      <!-- Letter 'A' -->
      <path d="M 0 38 L 13 0 L 26 38 L 18.5 38 L 16.2 30.5 L 9.8 30.5 L 7.5 38 Z M 11.5 24.5 L 14.5 24.5 L 13 11 Z" />
      <!-- Letter 'B' -->
      <path d="M 33 0 L 48.5 0 C 54.5 0 58.5 3 58.5 8 C 58.5 12 55.5 15 51.5 16 C 56.5 17.2 60 20.8 60 26.5 C 60 33.5 54.5 38 48 38 L 33 38 Z M 40.5 7 L 40.5 15 L 47.5 15 C 50.5 15 52 13.5 52 11 C 52 8.5 50.5 7 47.5 7 Z M 40.5 21.5 L 40.5 31 L 48 31 C 51.5 31 53 29 53 26 C 53 23 51.5 21.5 48 21.5 Z" />
      <!-- Letter 'A' -->
      <path d="M 67 38 L 80 0 L 93 38 L 85.5 38 L 83.2 30.5 L 76.8 30.5 L 74.5 38 Z M 78.5 24.5 L 81.5 24.5 L 80 11 Z" />
    </g>

    <!-- Red Square Accent / Apostrophe in ABA' -->
    <rect x="150" y="58" width="7" height="15" rx="1.5" fill="#E50914" />

    <!-- Bottom Red Banner for KHQR -->
    <rect x="8" y="136" width="184" height="56" fill="#D32F2F"/>
    <rect x="8" y="136" width="184" height="4" fill="#B71C1C" opacity="0.5"/>

    <!-- KHQR Bold Text -->
    <text x="100" y="176" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="27" letter-spacing="3" text-anchor="middle">
      KHQR
    </text>
  </g>
</svg>
