services:
  - type: web
    name: nadybackend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SANDBOX_MODE
        value: "false"
      - key: BACKEND_URL
        value: https://nadystore-backend.onrender.com
      - key: FRONTEND_URL
        value: https://www.nadytopup.site

  - type: web
    name: nadyfrontend
    env: node
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        value: https://nadystore-backend.onrender.com
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://nadystore-backend.onrender.com
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        value: "570013043660-p5uujjtc2sq24si85q3thmliqnf3s9uc.apps.googleusercontent.com"
